[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "PyMBCap"
version = "0.0.5"
authors = [
  { name="Guilherme Oliveira", email="gui.p.oliv@proton.me" },
]
description = "PyMBCap is a tool that makes using a message broker like RabbitMQ more seamless and easy to implement, with decorators and an injected service specifically for it."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "dependency-injector==4.49.1",
    "docopt==0.6.2",
    "idna==3.18",
    "pika==1.4.2",
    "pipreqs==0.4.13",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "yarg==0.1.10",
    "aio-pika==10.0.1",
]

[project.urls]
Homepage = "https://github.com/GuiOliv/PyCAP"
Issues = "https://github.com/GuiOliv/PyCAP/issues"